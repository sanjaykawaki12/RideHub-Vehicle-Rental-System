<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideHub — Profile</title><link rel="stylesheet" href="../css/mass.css"><style>.wrap{max-width:900px;margin:auto;padding:40px 20px}.panel{background:#111617;border:1px solid #27302f;border-radius:20px;padding:24px;margin-bottom:20px}label{display:block;margin:14px 0;color:#aeb8b5}input{width:100%;box-sizing:border-box;margin-top:7px;background:#0b0f10;color:#fff;border:1px solid #303938;border-radius:10px;padding:12px}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:#d6b36a;color:#111}.muted{color:#8f9a96}</style></head><body><main class="wrap"><a href="home.html" style="color:#d6b36a">← Back</a><h1>My Profile</h1><section class="panel"><h2>Account details</h2><label>Name<input id="name"></label><label>Email<input id="email" disabled></label><label>Phone<input id="phone"></label><button class="primary" onclick="saveProfile()">Save changes</button><p id="msg" class="muted"></p></section><section class="panel"><h2>Change password</h2><label>Current password<input id="current" type="password"></label><label>New password<input id="next" type="password"></label><button class="primary" onclick="changePassword()">Update password</button></section></main><script>const API='http://localhost:8080/api',token=localStorage.getItem('rentwheels_token');const headers={'Authorization':`Bearer ${token}`,'Content-Type':'application/json'};async function load(){const r=await fetch(API+'/user/profile',{headers});const b=await r.json();if(!r.ok)return;name.value=b.data.name||'';email.value=b.data.email||'';phone.value=b.data.phone||''}async function saveProfile(){const r=await fetch(API+'/user/profile',{method:'PUT',headers,body:JSON.stringify({name:name.value,phone:phone.value})});const b=await r.json();msg.textContent=b.message||'Saved';}async function changePassword(){const r=await fetch(API+'/user/profile/password',{method:'PATCH',headers,body:JSON.stringify({currentPassword:current.value,newPassword:next.value})});const b=await r.json();alert(b.message||'Updated');if(r.ok){current.value='';next.value=''}}load();</script></body></html>
