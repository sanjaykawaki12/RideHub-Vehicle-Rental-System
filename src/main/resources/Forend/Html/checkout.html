<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RideHub — Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/checkout.css">
<link rel="stylesheet" href="../css/mass.css">
<style>.payment-methods{margin-top:18px;padding-top:16px;border-top:1px solid #2a302f}.payment-methods h4{margin:0 0 10px}.method{display:grid;grid-template-columns:20px 1fr;gap:2px 8px;padding:10px;border:1px solid #2a302f;border-radius:10px;margin:7px 0;cursor:pointer}.method input{grid-row:1/3}.method span{font-weight:700}.method small{color:#8f9996}.payment-fields input{width:100%;box-sizing:border-box;margin-top:8px;padding:12px;border-radius:10px;border:1px solid #303938;background:#0d1112;color:#fff}</style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 13l1.5-4.5A2 2 0 016.4 7h11.2a2 2 0 011.9 1.5L21 13" stroke="#E7A94C" stroke-width="1.8" stroke-linecap="round"/><rect x="2.5" y="13" width="19" height="6" rx="2" stroke="#F5F1E7" stroke-width="1.8"/><circle cx="7" cy="19.5" r="1.6" fill="#F5F1E7"/><circle cx="17" cy="19.5" r="1.6" fill="#F5F1E7"/></svg>
        RideHub
      </div>
      <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="bookings.html">My bookings</a>
        <button class="logout-btn" id="logoutBtn">Log out</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="back-link" id="backLink">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back
    </div>

    <div class="checkout-grid">
      <div class="checkout-card">
        <h2>Booking details</h2>

        <div class="vehicle-summary">
          <div class="thumb" id="vehicleThumb"></div>
          <div>
            <h3 id="vehicleName"></h3>
            <p id="vehicleMeta"></p>
          </div>
        </div>

        <div id="checkoutMsg" class="inline-msg"></div>

        <form id="checkoutForm">
          <div class="field-row">
            <div class="field">
              <label for="startDate">Start date</label>
              <input type="date" id="startDate" required>
            </div>
            <div class="field">
              <label for="endDate">End date</label>
              <input type="date" id="endDate" required>
            </div>
          </div>

          <div class="field">
            <label for="licenseSelect">Driving license</label>
            <select id="licenseSelect"></select>
            <div class="hint" id="licenseHint"></div>
          </div>
        </form>
      </div>

      <div class="bill-card">
        <h3>Bill summary</h3>
        <div class="bill-row"><span>Rate</span><span id="billRate">₹0 / day</span></div>
        <div class="bill-row"><span>Duration</span><span id="billDays">0 days</span></div>
        <div class="bill-row total"><span>Total</span><span id="billTotal">₹0</span></div>
        <div class="payment-methods">
          <h4>Payment method</h4>
          <label class="method"><input type="radio" name="paymentMethod" value="UPI" checked><span>UPI</span><small>GPay / PhonePe / Paytm</small></label>
          <label class="method"><input type="radio" name="paymentMethod" value="CARD"><span>Card</span><small>Credit / Debit card</small></label>
          <label class="method"><input type="radio" name="paymentMethod" value="CASH"><span>Pay at pickup</span><small>Available if shop supports it</small></label>
        </div>
        <div id="paymentFields" class="payment-fields"><input id="upiId" placeholder="Enter UPI ID (demo)"></div>
        <button class="pay-btn" id="payBtn">Continue to Payment</button>
        <p class="mock-note">Secure checkout · Demo mode is enabled, so no real money is charged.</p>
      </div>
    </div>
  </main>

  <!-- Add license modal (shown if user has no license yet) -->
  <div class="modal-overlay" id="licenseModal">
    <div class="modal">
      <button class="modal-close" id="closeLicenseModal">&times;</button>
      <h3>Add a driving license</h3>
      <p class="section-sub">You need a license on file before booking.</p>
      <div id="licenseFormMsg" class="inline-msg"></div>
      <form id="licenseForm">
        <div class="field" style="margin-bottom:14px;">
          <label for="licenseNumberInput">License number</label>
          <input type="text" id="licenseNumberInput" required placeholder="TN0120230012345">
        </div>
        <div class="field" style="margin-bottom:14px;">
          <label for="licenseFileInput">Upload photo / scan</label>
          <input type="file" id="licenseFileInput" accept="image/*,.pdf" required>
        </div>
        <button class="submit-btn" type="submit" id="uploadLicenseBtn">Upload</button>
      </form>
    </div>
  </div>

<script src="../javascript/checkout.js"></script>
</body>
</html>
