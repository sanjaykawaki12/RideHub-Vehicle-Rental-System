<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideHub — Notifications</title><link rel="stylesheet" href="../css/mass.css"></head><body style="background:#080a0b;color:white;font-family:Arial"><main style="max-width:850px;margin:50px auto;padding:20px"><a href="home.html" style="color:#d6b36a">← Back</a><h1>Notifications</h1><div id="list"></div></main><script>const t=localStorage.getItem('rentwheels_token');async function load(){const r=await fetch('http://localhost:8080/api/user/notifications',{headers:{Authorization:'Bearer '+t}}),b=await r.json();document.getElementById('list').innerHTML=(b.data||[]).map(n=>`<article style="padding:18px;border:1px solid #252d2d;border-radius:14px;margin:12px 0;background:#111617;opacity:${n.read?.6:1}"><b>${n.title}</b><p>${n.message}</p><small>${new Date(n.createdAt).toLocaleString()}</small></article>`).join('')||'<p>No notifications.</p>'}load()</script></body></html>
