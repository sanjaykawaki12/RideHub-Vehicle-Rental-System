<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RideHub — Manage Vehicles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/owner-vehicles.css">
<link rel="stylesheet" href="../css/mass.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 10.5L12 4l9 6.5M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9" stroke="#4FA3A0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        RideHub <span class="owner-tag">Owner</span>
      </div>
      <nav class="nav-links">
        <a href="owner-dashboard.html">Dashboard</a>
        <a href="owner-vehicles.html" class="active">Vehicles</a>
        <a href="owner-bookings.html">Bookings</a>
        <button class="logout-btn" id="logoutBtn">Log out</button>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>Your vehicles</h2>
          <p class="sub">Add, edit, remove, or change availability status.</p>
        </div>
        <button class="btn-primary" id="addVehicleBtn">+ Add vehicle</button>
      </div>
      <div id="vehiclesMsg" class="inline-msg"></div>
      <div class="vehicle-table" id="vehicleTable"></div>
    </section>
  </main>

  <!-- ============ ADD / EDIT VEHICLE MODAL ============ -->
  <div class="modal-overlay" id="vehicleModal">
    <div class="modal">
      <button class="modal-close" id="closeVehicleModal">&times;</button>
      <h3 id="vehicleModalTitle">Add vehicle</h3>
      <div id="vehicleFormMsg" class="inline-msg"></div>
      <form id="vehicleForm">
        <div class="field">
          <label for="vName">Vehicle name</label>
          <input type="text" id="vName" required placeholder="Honda Activa">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="vType">Type</label>
            <select id="vType" required>
              <option value="CAR">Car</option>
              <option value="BIKE">Bike</option>
              <option value="SCOOTER">Scooter</option>
              <option value="VAN">Van</option>
              <option value="TRUCK">Truck</option>
            </select>
          </div>
          <div class="field">
            <label for="vModel">Model / year</label>
            <input type="text" id="vModel" placeholder="2023">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="vReg">Registration number</label>
            <input type="text" id="vReg" required placeholder="TN01AB1234">
          </div>
          <div class="field">
            <label for="vPrice">Price per day (₹)</label>
            <input type="number" step="0.01" id="vPrice" required placeholder="500">
          </div>
        </div>
        <div class="field">
          <label for="vImage">Vehicle photo</label>
          <input type="file" id="vImage" accept="image/*">
          <div class="hint" id="imagePreviewWrap" style="margin-top:6px; display:none;">
            <img id="imagePreview" style="width:100%; max-height:140px; object-fit:cover; border-radius:10px;">
          </div>
        </div>
        <button class="submit-btn" type="submit" id="vehicleSubmitBtn"><span>Add vehicle</span></button>
      </form>
    </div>
  </div>

<script src="../javascript/owner-vehicles.js"></script>
</body>
</html>
