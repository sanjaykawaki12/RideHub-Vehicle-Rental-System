<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideHub — Support</title><link rel="stylesheet" href="../css/mass.css"><link rel="stylesheet" href="../css/support.css"></head><body><header class="top"><a href="home.html" class="brand">RH <span>RideHub</span></a><nav><a href="home.html">Explore</a><a href="bookings.html">Bookings</a><a class="active" href="support.html">Support</a><button id="logout">Log out</button><a href="profile.html">Profile</a></nav></header><main class="wrap"><div class="head"><div><small>CUSTOMER CARE</small><h1>How can we help?</h1><p>Create a ticket and our support team can follow it with you.</p></div><div class="help-card">24/7 support<br><b>Booking · Payment · Vehicle · Account</b></div></div><section class="grid"><form id="ticketForm" class="panel"><h2>Raise a support ticket</h2><label>Category<select id="category"><option>Booking</option><option>Payment</option><option>Vehicle</option><option>Account</option><option>Other</option></select></label><label>Priority<select id="priority"><option>NORMAL</option><option>HIGH</option><option>URGENT</option></select></label><label>Subject<input id="subject" required placeholder="What went wrong?"></label><label>Message<textarea id="message" required rows="6" placeholder="Explain your issue…"></textarea></label><button class="primary" type="submit">Create ticket</button><p id="msg"></p></form><section class="panel"><div class="panel-head"><h2>My tickets</h2><button class="ghost" onclick="loadTickets()">Refresh</button></div><div id="tickets"></div></section></section></main><script src="../javascript/support.js"></script></body></html>
