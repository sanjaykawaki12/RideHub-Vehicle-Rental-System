<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideHub — Admin Support</title><link rel="stylesheet" href="../css/mass.css"><style>
body{background:#080a0b;color:#f5f1e7;font-family:Arial}.wrap{max-width:1200px;margin:auto;padding:40px 20px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.card,.panel{background:#111617;border:1px solid #27302f;border-radius:18px;padding:20px}.card b{font-size:30px;display:block;color:#d6b36a}.card span{color:#9ba5a2;text-transform:capitalize}.panel{margin-top:24px}.ticket{border-top:1px solid #293131;padding:18px 0}.ticket:first-child{border-top:0}.ticket-head{display:flex;justify-content:space-between;gap:20px}.customer{color:#aeb8b5;font-size:13px;margin-top:6px}.meta{color:#7f8b87;font-size:13px;margin:8px 0}.status{border:1px solid #5a4a2d;border-radius:999px;padding:6px 10px;color:#d6b36a;font-size:12px}.thread{display:flex;flex-direction:column;gap:8px;margin:14px 0}.msg{padding:10px 12px;border-radius:12px;background:#151b1b;border:1px solid #27302f;display:flex;flex-direction:column;gap:3px}.msg.customer{border-color:#6f5830}.msg.support{border-color:#31504a}.msg small{opacity:.55}.reply{display:flex;gap:8px;flex-wrap:wrap}.reply input{flex:1;min-width:220px;background:#0b0f10;color:white;border:1px solid #303938;border-radius:9px;padding:10px}.reply button{background:#d6b36a;color:#111;border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}
button{background:#d6b36a;color:#111;border:0;border-radius:8px;padding:7px 10px;font-weight:700;cursor:pointer;margin-left:8px}</style></head><body><main class="wrap"><a href="login.html" style="color:#d6b36a">← Login</a><h1>Admin Control Center</h1><p style="color:#9ba5a2">Customer messages & support inbox</p><section id="stats" class="stats"></section><section class="panel"><h2>Driving License Verification</h2><div id="licenses">Loading licenses…</div></section><section class="panel"><h2>Reports</h2><div id="reports">Loading reports…</div></section><section class="panel"><h2>Customer Support Inbox</h2><div id="tickets"></div></section></main><script src="../javascript/admin.js"></script></body></html>
