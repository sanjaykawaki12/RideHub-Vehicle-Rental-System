spring.application.name=vehicle-rental-backend
server.port=8080

# ---------- PAYMENT ----------
# mock = local testing without real payment
# razorpay = real Razorpay integration
app.payment.provider=${PAYMENT_PROVIDER:mock}

# ---------- MySQL ----------
# Set DB_URL, DB_USERNAME and DB_PASSWORD as environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vehicle_rental_dbs?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Set JWT_SECRET as an environment variable. Do not commit the real secret to GitHub.
app.jwt.secret=${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET}
app.jwt.expiration-ms=86400000

# ---------- Razorpay ----------
# Required only when PAYMENT_PROVIDER=razorpay
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# ---------- File upload ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:5500}
